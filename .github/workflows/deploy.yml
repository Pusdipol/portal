name: Deploy Laravel + Vite

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ##################################
      # PHP
      ##################################
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, bcmath, intl, pdo_mysql, zip

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer Dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.GITHUB_TOKEN}}"}}'
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      ##################################
      # Node
      ##################################
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install NPM Packages
        run: npm ci --legacy-peer-deps

      - name: Build Assets
        run: npm run build

      ##################################
      # SSH
      ##################################
      - name: Load SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      ##################################
      # Upload
      ##################################
      - name: Sync Files
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".env" \
            --exclude "node_modules" \
            --exclude "storage/logs" \
            --exclude "storage/app" \
            --exclude "storage/framework" \
            --exclude "bootstrap/cache" \
            --exclude "public/storage" \
            --exclude "jurnal" \
            --exclude "buku" \
            ./ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

      ##################################
      # Laravel
      ##################################
      - name: Run Laravel Commands
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no \
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          set -e

          cd ${{ secrets.DEPLOY_PATH }}

          echo "Clearing old cache files to prevent Pail/Telescope errors..."
          rm -f bootstrap/cache/*.php

          echo "Bypassing Hostinger CLI PDO limitation..."
          php artisan migrate --force || echo "Migration skipped via CLI. Run via web route or manually."
          php artisan optimize:clear
          php artisan optimize
          php artisan storage:link || true

          EOF
